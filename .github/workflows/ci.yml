name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      HYPOTHESIS_PROFILE: ci
      UV_PYTHON: ${{ matrix.python-version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

      - name: Layering
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Wheel smoke test (fresh environment)
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          expected="$(uv run --no-sync python -c 'import rift; print(rift.__version__)')"
          # --isolated --no-project: a fresh ephemeral environment containing only the built wheel.
          human="$(uv run --isolated --no-project --with "$wheel" rift version | tr -d '\r')"
          json="$(uv run --isolated --no-project --with "$wheel" rift version --json | tr -d '\r')"
          echo "human: $human"; echo "json:  $json"
          test "$human" = "rift $expected"
          test "$json" = "{\"name\":\"rift\",\"version\":\"$expected\"}"

  lowest-direct:
    # Checks that the declared lower bounds of direct dependencies (rich, jsonschema, typer, …)
    # actually work: resolve every direct dependency to its minimum allowed version.
    name: tests (lowest-direct, ubuntu-latest, py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HYPOTHESIS_PROFILE: ci
      UV_PYTHON: "3.11"
      # Enables tests/unit/test_dependency_floors.py::test_lowest_direct_job_really_installed_the_floors,
      # which fails unless every direct dependency is installed exactly at its declared floor and
      # the loosened floors are older than the committed lockfile.
      RIFT_EXPECT_LOWEST_DIRECT: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          python-version: "3.11"
          enable-cache: true

      - name: Install (lowest direct versions)
        # Re-resolves instead of using uv.lock; the rewritten lockfile is discarded with the runner.
        run: uv sync --resolution lowest-direct

      - name: Show resolved runtime versions
        run: uv pip list | grep -E '^(typer|rich|jsonschema) '

      - name: Tests
        # --no-sync: a plain `uv run` would re-sync to uv.lock and undo the lowest resolution.
        run: uv run --no-sync pytest

  git-minimum:
    # Proves the minimum supported git (ADR-0006): the whole suite against git 2.30.x.
    # python:3.11-bullseye is Debian 11 and ships git 2.30.2 preinstalled (no apt needed).
    name: tests (git 2.30, debian bullseye, py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: python:3.11-bullseye
    env:
      HYPOTHESIS_PROFILE: ci
      UV_PYTHON: "3.11"
      UV_PYTHON_PREFERENCE: only-system
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require git 2.30.x (the declared minimum)
        run: |
          git --version
          git --version | grep -E '^git version 2\.30\.'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked

      - name: Tests
        run: uv run pytest
